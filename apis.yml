- name: Clozd Data API v1.0
  description: >-
    Original version of the Clozd public Data API, limited to a single deal-and-participant import
    operation for pushing CRM opportunity data into a Clozd program. Superseded by v2.0 and v3.0.
    Authenticated with the x-api-token header.
  humanURL: https://app.clozd.com/public-api/docs/?urls.primaryName=v1.0

apis:
- name: Clozd MCP Server
  description: >-
    Hosted remote Model Context Protocol server exposing 19 documented read tools over Clozd win-loss
    data — programs, deals, responses, response summaries, transcripts, decision drivers and categories,
    driver quotes, win rates, competitors, competitor sentiment drivers, AWE (at-risk/win-back/expansion)
    deals, tags, and the Gong-derived driver family. Authenticated with OAuth 2.0 authorization code +
    PKCE against oauth.clozd.com, brokered to the customer's own identity provider (Okta, Google, Microsoft,
    SAML); no API keys are stored client-side. Supported in Claude, ChatGPT Apps, Cursor, Microsoft Copilot
    Studio, Windsurf, Antigravity, and Gemini CLI.
  humanURL: https://help.clozd.com/hc/en-us/articles/49656607624987-Connecting-to-Clozd-via-MCP
  baseURL: https://mcp.clozd.com/mcp

aid: clozd
name: Clozd
description: >-
  Clozd is a Lehi, Utah based decision-intelligence and win-loss analysis platform that collects structured
  buyer feedback — through human-led live interviews, AI-assisted Flex interviews, and autonomous Flow
  interviews — and turns it into decision drivers, competitor sentiment, win rates, and verbatim buyer quotes
  for sales, marketing, product, and customer-success teams. The platform integrates with Salesforce, HubSpot,
  Microsoft Dynamics, Gong, Slack, Calendly, Outlook, and Gmail, and exposes two public programmatic surfaces:
  the versioned Clozd Data API (v1/v2/v3) documented with OpenAPI 3.0.3 and Swagger UI at app.clozd.com for
  importing deals and participants and exporting programs, deals, touchpoints, responses, transcripts, and
  competitors; and a hosted, OAuth 2.0 protected Model Context Protocol server at mcp.clozd.com that gives
  Claude, ChatGPT, Cursor, Copilot, Windsurf, Antigravity, and Gemini CLI direct tool access to the same
  win-loss data.

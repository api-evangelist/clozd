- name: Clozd Data API v3.0
  description: >-
    Current version of the Clozd public Data API. Read programs, competitors, deals (with participants,
    products, published feedback responses and full transcripts), and touchpoints; import deals and
    touchpoints. Offset/limit pagination with self/prev/next/first/last links. Authenticated with an
    organization API token in the x-api-token header, created from the Settings screen of the Clozd
    application.

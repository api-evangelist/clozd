      tags:
      - /programs/:program_id/deals/:deal_id
      parameters:
      - description: 'Specifies type of data to include with deal. NOTE: Cannot include ''transcripts'' without also including ''feedback'' (maxItems:5)'
        in: query
        name: include[]
        required: false
        schema:
          description: 'Specifies type of data to include with deal. NOTE: Cannot include ''transcripts'' without also including ''feedback'' (maxItems:5)'
          default:
          - customFields
          - participants
          - products
          - feedback
          maxItems: 5
          nullable: true
          type: array
          items:
            description: Parameter without description.
            enum:
            - customFields
            - participants
            - products
            - feedback
            - transcripts
            type: string
        example:
        - customFields
        - participants
        - products
      - description: Clozd program ID (min:36 chars, max:36 chars)
        in: path
        name: program_id
        required: true
        schema:
          description: Clozd program ID (min:36 chars, max:36 chars)
          minLength: 36
          maxLength: 36
          type: string
          format: uuid
        example: 760c040c-5dda-41e8-85ff-ef8f411d39d5
      - description: Clozd deal ID (min:36 chars, max:36 chars)
        in: path
        name: deal_id
        required: true

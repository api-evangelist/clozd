- from: Deal
  to: 'CRM opportunity (external)'
  type: belongs_to
  via: clozd_external_id
- from: Touchpoint
  to: 'CRM record (external)'
  type: belongs_to
  via: clozd_external_id
envelopes:
- name: PagedListResponse
  wraps: any collection
  fields:
  - success
  - message
  - links{self,prev,next,first,last}
  - count
  - total
  - data
- name: ListOfPrograms
- name: ListOfDealsWithResponses
- name: ListOfTouchpointsWithResponses
- name: ListOfCompetitorsWithDeals
error_schemas:
- BadRequest
- Unauthorized
- Forbidden
- NotFound
gaps:
- >-
  Participants, responses, transcripts and survey questions have no addressable URL of their own — they are
  only reachable as expansions of a deal, touchpoint or competitor.
- >-
  Decision drivers are a string field on Response in REST, not a first-class entity, even though the MCP
  server treats drivers, driver categories and driver quotes as first-class collections.
- Products (clozd_products) is a field on Deal, not a modelled entity.

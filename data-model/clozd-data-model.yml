- from: Deal
  to: Response
  type: has_many
  via: DealWithResponses (include=feedback)
- from: Deal
  to: SurveyQuestion
  type: has_many
  via: include=surveyQuestions
- from: Touchpoint
  to: Participant
  type: has_many
  via: TouchpointWithParticipants (include=participants, single-touchpoint only)
- from: Touchpoint
  to: TouchpointResponse
  type: has_many
  via: TouchpointWithResponses (include=feedback)
- from: Response
  to: SurveyQuestion
  type: has_many
  via: clozd_survey_questions
- from: Response
  to: Competitor
